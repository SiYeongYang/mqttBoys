name: Release Windows executable

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore .\MqttPulse.slnx -r win-x64

      - name: Test
        run: dotnet test .\MqttPulse.Tests\MqttPulse.Tests.csproj -c Release --no-restore

      - name: Publish single executable
        run: >-
          dotnet publish .\MqttPulse.App\MqttPulse.App.csproj
          -c Release
          -r win-x64
          --self-contained true
          --no-restore
          -o .\publish
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $asset = ".\publish\mqttBoys.exe"
          $version = $tag.TrimStart("v")
          $changelog = Get-Content .\CHANGELOG.md -Raw
          $escapedVersion = [regex]::Escape($version)
          $pattern = "(?ms)^## \[$escapedVersion\][^\r\n]*\r?\n(?<body>.*?)(?=^## \[|\z)"
          $match = [regex]::Match($changelog, $pattern)
          if (-not $match.Success) {
            throw "CHANGELOG.md does not contain release notes for $tag."
          }

          $notesPath = Join-Path $env:RUNNER_TEMP "mqttBoys-release-notes.md"
          $notes = $match.Groups["body"].Value.Trim()
          [System.IO.File]::WriteAllText(
            $notesPath,
            $notes,
            [System.Text.UTF8Encoding]::new($false))

          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $asset --clobber --repo $env:GITHUB_REPOSITORY
            gh release edit $tag --notes-file $notesPath --title "mqttBoys $tag" --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag $asset --verify-tag --notes-file $notesPath --title "mqttBoys $tag" --repo $env:GITHUB_REPOSITORY
          }
